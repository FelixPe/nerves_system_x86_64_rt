# This file is loaded by GRUB normal mode from the EFI System Partition.
# Locate the ESP before loading the environment stored beside this file.
search --no-floppy --label NERVES_ESP --set=root
load_env --file=($root)/EFI/BOOT/grubenv

if [ "${boot}" = "1" ]; then
     echo "Booting partition B..."
     linux /boot/bzImage-b root=PARTUUID=f18a2026-1012-4f44-8000-000000000003 rootwait console=tty1 console=ttyS0,115200
else
     echo "Booting partition A..."
     linux /boot/bzImage-a root=PARTUUID=f18a2026-1012-4f44-8000-000000000002 rootwait console=tty1 console=ttyS0,115200
fi

# Boot the selected firmware slot.
boot
